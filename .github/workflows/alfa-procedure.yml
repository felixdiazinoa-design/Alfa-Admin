name: ALFA procedure integrity
on:
  pull_request:
    branches: [develop]
    paths:
      - '.codex/**'
      - 'docs/architecture/**'
      - 'AGENTS.md'
      - 'WORKFLOW.md'
      - '.github/workflows/alfa-procedure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  procedure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 .codex/validate_agents.py
      - run: node --test .codex/workflow.test.mjs
